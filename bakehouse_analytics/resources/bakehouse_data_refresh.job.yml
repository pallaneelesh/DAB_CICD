# A sample job for bakehouse_analytics.

resources:
  jobs:
    bakehouse_data_refresh:
      name: bakehouse_data_refresh

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: customer_360
          notebook_task:
            notebook_path: ../src/customer_360.ipynb
        - task_key: transactions_summary
          depends_on:
            - task_key: customer_360
          notebook_task:
            notebook_path: ../src/transactions_summary.ipynb
        - task_key: orders
          depends_on:
            - task_key: transactions_summary
          sql_task:
            query:
              query_id: d0a1bae1-0781-4881-a7f5-9f8e68befe39
            warehouse_id: fb3749e6fed9b564

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
